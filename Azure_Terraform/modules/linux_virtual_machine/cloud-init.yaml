#cloud-config

package_update: true
package_upgrade: true

packages:
  - nginx
  - unzip
  - curl
  - gnupg
  - software-properties-common

runcmd:

  # Download HashiCorp GPG key
  - curl -fsSL https://apt.releases.hashicorp.com/gpg | gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg

  # Add HashiCorp Repository
  - echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" > /etc/apt/sources.list.d/hashicorp.list

  # Install Terraform
  - apt update
  - apt install terraform -y

  # Create Custom HTML
  - |
      cat <<EOF > /var/www/html/index.html
      <!DOCTYPE html>
      <html>
      <head>
          <title>Terraform Demo</title>
      </head>
      <body style="background-color:#f2f2f2;text-align:center;font-family:Arial;">
          <h1>🚀 Welcome to Terraform + Azure + Nginx</h1>
          <h2>Cloud-init executed successfully.</h2>
          <p>This page was deployed automatically using Terraform.</p>
      </body>
      </html>
      EOF

  # Enable nginx
  - systemctl enable nginx

  # Restart nginx
  - systemctl restart nginx